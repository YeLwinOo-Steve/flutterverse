name: deploy-web

on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'packages/fv_core/**', 'pubspec.yaml']
  workflow_run:
    workflows: [ingest]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 60
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch data
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            mkdir -p apps/web/web/data
            git archive FETCH_HEAD data | tar -x --strip-components=1 -C apps/web/web/data
          else
            echo "No data branch yet; building without data."
          fi
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get && dart pub global activate jaspr_cli
      - run: jaspr build --sitemap-domain=https://flutterverse.org --sitemap-exclude=/404
        working-directory: apps/web
      # jaspr lists routes without a trailing slash, but Pages redirects
      # `/rankings` to `/rankings/`; list the served URLs, matching canonicals.
      - run: sed -i -E 's#<loc>([^<]*[^/<])</loc>#<loc>\1/</loc>#' apps/web/build/jaspr/sitemap.xml
      # main.css and the client script keep the same names every build, so a
      # browser holding a cached copy pairs new pages with old styles. Tag the
      # links with a content hash so each deploy's pages fetch their own.
      - name: Version assets
        working-directory: apps/web/build/jaspr
        run: |
          css=$(md5sum main.css | cut -c1-10)
          js=$(md5sum main.client.dart.js | cut -c1-10)
          find . -name '*.html' -exec sed -i \
            -e "s#href=\"main.css\"#href=\"main.css?v=$css\"#" \
            -e "s#src=\"main.client.dart.js\"#src=\"main.client.dart.js?v=$js\"#" {} +
          grep -q "main.css?v=$css" index.html
      # Per-project JSON only feeds the build; leaving it out keeps the
      # deploy well under Cloudflare Pages' 20,000-file limit.
      - run: rm -rf apps/web/build/jaspr/data/p
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy apps/web/build/jaspr --project-name=flutterverse --branch=main
