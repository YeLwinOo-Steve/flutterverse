# Daily data job: fetches pub.dev and GitHub stats and commits them to the
# `data` branch. A successful run triggers deploy-web.

name: ingest

on:
  schedule: [{ cron: '17 3 * * *' }]   # daily, at an off-peak minute
  # Seed edits (new projects, Hall of Fame entries) go live without waiting
  # for the schedule. A repeat run replaces the day's history line.
  push:
    branches: [main]
    paths: [config/**]
  workflow_dispatch:

permissions:
  contents: write

concurrency: ingest

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4   # main: the code
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get

      # The `data` branch holds data/ and history/; create it on the first run.
      - name: Check out data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add -B data out FETCH_HEAD
          else
            git worktree add --orphan -b data out
          fi

      - run: dart run fv_ingest:ingest --out out/data --history out/history --activity out/history/activity.json --concurrency 8
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

      - name: Commit and push
        working-directory: out
        run: |
          git config user.name fv-bot
          git config user.email fv-bot@users.noreply.github.com
          git add -A data history
          if git rev-parse -q --verify HEAD >/dev/null && git diff --cached --quiet HEAD; then
            echo "No changes"; exit 0
          fi
          # Keep a single commit: thousands of files change every day, and
          # history/ already carries the past, so old commits would only
          # bloat the repo.
          commit=$(git commit-tree "$(git write-tree)" -m "data: $(date -u +%F)")
          git push --force origin "$commit:refs/heads/data"
