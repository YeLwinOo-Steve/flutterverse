# Field labels are parsed by packages/fv_ingest/lib/src/nominations.dart
# (NominationField). Rename them in both places.
name: Nominate a project
description: Propose an open-source project or app for the Flutterverse Hall of Fame.
title: 'Hall of Fame nomination: '
labels: [nomination]
body:
  - type: markdown
    attributes:
      value: |
        Nominations are checked automatically, then reviewed by the editorial team before each edition.
        Projects need a public GitHub repository with at least 50 stars.
  - type: input
    id: repo
    attributes:
      label: Repository
      description: GitHub `owner/name`.
      placeholder: felangel/bloc
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Award category
      description: An existing award (such as "Best UI" or "Most Innovative") or a new one.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why they deserve it
      description: What makes this project stand out?
    validations:
      required: true
