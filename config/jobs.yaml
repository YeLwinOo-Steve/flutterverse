# Companies the daily jobs step polls for open Flutter and Dart roles.
# Jobs only links out: each row on /jobs goes to the company's own posting.
#
# Add a company with a pull request. Fields:
#   id       lowercase slug, unique here
#   name     display name (quote it if it has a comma)
#   ats      greenhouse | lever | ashby
#   token    the board name in the hiring system's URL:
#              job-boards.greenhouse.io/<token>   jobs.lever.co/<token>   jobs.ashbyhq.com/<token>
#   region   Lever only: eu, for accounts on jobs.eu.lever.co
#   careers  optional https URL of the company's own careers page
#
# Keep companies with no Flutter role open today: they cost one request a
# day and show up when they hire. Check with:
#   dart run fv_ingest:validate_jobs --remote
#
# Opening the PR? Use the jobs template: add `?template=jobs-company.md` to the
# compare page URL, e.g.
#   https://github.com/YeLwinOo-Steve/flutterverse/compare/main...<you>:<branch>?template=jobs-company.md
# No PR? Use the "List a company on Jobs" issue form. To be removed, use the
# "Remove roles from Jobs" form: https://github.com/YeLwinOo-Steve/flutterverse/issues/new/choose

# Roles from Workable's job feed (all Workable customers) are dropped for these names
# (any case): recruiters, staffing firms and marketplaces that post other
# companies' roles, and posters that hide the employer.
exclude_companies:
  - Company
  - Pavago
  - Two95 International
  - Workana
  - Xcellink

