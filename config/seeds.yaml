# Projects tracked by Flutterverse. Edit this file with a pull request to add
# or change a project; see CONTRIBUTING.md.
#
# Each project needs an `id` (lowercase, URL-safe; use the pub package name
# for packages), at least one category, and a `pub` package name and/or a
# GitHub `repo` (owner/name). When `repo` is omitted it's derived from the
# package's pubspec. `kind` is `package` (default) or `project`. `sdk` and
# `platforms` come from pub.dev tags; set them only for unpublished projects.
# `related` lists project ids that are commonly used together.
#
# The learning roadmap lives in config/roadmap.json.

categories:
  state-management: State management
  architecture: Architecture
  navigation: Navigation
  networking: Networking
  database: Database
  serialization: Serialization
  code-generation: Code generation
  dependency-injection: Dependency injection
  ui: UI
  theming: Theming
  animation: Animation
  charts: Charts
  games: Games
  testing: Testing
  backend: Backend
  cli: CLI
  developer-tooling: Developer tooling
  open-source-app: Open source app
  firebase: Firebase
  authentication: Authentication
  maps: Maps
  ai: AI

# Groups shown on the Explore page.
category_groups:
  Architecture: [state-management, architecture, navigation, dependency-injection]
  Data & backend: [networking, database, serialization, firebase, backend, authentication]
  UI & motion: [ui, animation, charts, maps, games]
  Tooling: [testing, cli, developer-tooling, ai]

