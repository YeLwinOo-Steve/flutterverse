# The current Hall of Fame edition. Reasons are editorial; keep them factual.
hall_of_fame:
  year: 2026
  projects:
    - { id: flutter_bloc, category: Most Influential, reason: "Set the vocabulary for structured state in Flutter; its patterns shaped how a generation of production apps are architected." }
    - { id: riverpod, category: Community Favorite, reason: "Widely recommended for compile-safe, testable state — and a frequent reference point in community architecture discussions." }
    - { id: provider, category: The Original, reason: "The first recommended approach to app state, and the foundation many later libraries built on." }
    - { id: dio, category: Most Starred, reason: "The most-starred Dart networking library, and the default HTTP layer in countless apps." }
    - { id: forui, category: Fastest Growing, reason: "From first release to a top UI kit in under two years, with steady releases." }
    - { id: wonderous, category: Best UI, reason: "A public reference for what high-craft, motion-rich Flutter UI can look like." }
    - { id: melos, category: Best Developer Tool, reason: "Made multi-package Dart repositories practical, and is now standard in large monorepos." }
    - { id: flutter_animate, category: Best Animation Project, reason: "Turned complex effect choreography into a readable, chainable API." }
    - { id: shorebird, category: Most Innovative, reason: "Brought over-the-air code push to compiled Flutter apps — previously thought impractical." }
    - { id: flame, category: Longest Running, reason: "Actively developed since 2017 — older than Flutter 1.0 itself." }
    - { id: get, category: Most Liked, reason: "The most-liked package on pub.dev, bundling state, routing and dependency injection in one API." }
    - { id: freezed, category: Code Gen Standard, reason: "Made immutable data classes and unions routine in Dart." }
    - { id: json_serializable, category: Serialization Standard, reason: "The default JSON code generator for Dart since the Dart 2 era." }
    - { id: go_router, category: Official Routing, reason: "Grew from a community package into Flutter's recommended router." }
    - { id: rxdart, category: Elder Statesman, reason: "On pub.dev since 2015, before Flutter's first alpha, and still a staple of reactive Dart." }
    - { id: flutter_hooks, category: Composition, reason: "Brought React-style hooks to Flutter widgets." }
    - { id: flutter_local_notifications, category: Most Relied On, reason: "One of the most-liked plugins on pub.dev, and the standard way to schedule local notifications." }
    - { id: cached_network_image, category: Everyday Essential, reason: "The standard way to load and cache network images since 2017." }
    - { id: flutter_slidable, category: Best Interaction, reason: "The go-to swipe-action list item, liked by thousands of developers." }
    - { id: flex_color_scheme, category: Best Theming, reason: "Comprehensive Material theming, from a single seed color to every component." }
    - { id: win32, category: Dart on the Desktop, reason: "Made calling the Windows API from Dart practical, with millions of downloads." }
    - { id: mason, category: Best Scaffolding, reason: "Template-based code generation used across the ecosystem." }
    - { id: dart_frog, category: Server-Side Dart, reason: "A fast, minimalist backend framework that made Dart on the server approachable." }
    - { id: localsend-localsend, category: Most Starred App, reason: "An open-source, cross-platform AirDrop alternative and one of the most-starred Flutter apps." }
    - { id: appflowy-io-appflowy, category: Best Productivity App, reason: "An open-source Notion alternative built on Flutter, with tens of thousands of stars." }
    - { id: immich, category: Best Self-Hosted App, reason: "The leading self-hosted photo library, with a Flutter mobile app." }
    - { id: rustdesk, category: Best Desktop App, reason: "An open-source remote desktop whose cross-platform UI is Flutter." }
    - { id: solido-awesome-flutter, category: Community Resource, reason: "The canonical curated list of Flutter libraries, tools and tutorials." }
    - { id: team-spotube-spotube, category: Best Media App, reason: "An open-source music client showing Flutter on every desktop and mobile platform." }
  developers:
    - { handle: dnfield, name: Dan Field, category: In Memoriam, memorial: true, tagline: "On the Flutter team from 2018 until his death in 2024. Author of flutter_svg and vector_graphics, which still render images in countless apps. Rest in peace, Dan.", projects: [flutter_svg, vector_graphics] }
    - { handle: felangel, name: Felix Angelov, category: Most Influential, tagline: "Creator of the bloc state management library.", projects: [flutter_bloc, mocktail] }
