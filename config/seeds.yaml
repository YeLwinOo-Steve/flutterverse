# Projects tracked by Flutterverse. Edit this file with a pull request to add
# or change a project; see CONTRIBUTING.md.
#
# Each project needs an `id` (lowercase, URL-safe; use the pub package name
# for packages), at least one category, and a `pub` package name and/or a
# GitHub `repo` (owner/name). When `repo` is omitted it's derived from the
# package's pubspec. `kind` is `package` (default) or `project`. `sdk` and
# `platforms` come from pub.dev tags; set them only for unpublished projects.
# `related` lists project ids that are commonly used together.
#
# Beyond these, ingest discovers projects on its own (see `discovery:`).
# Listing a discovered project here overrides its name and categories.
#
# The learning roadmap lives in config/roadmap.json.

# Tracked automatically, on top of `projects:` below: every Flutter Favorite,
# pub.dev's `pub_top` most popular packages, and public Dart repos on GitHub
# with at least `github_min_stars` stars. `discontinued_watch` names packages
# to check for pub.dev's discontinued flag although nothing tracked depends on
# them, so Pubspec Doctor can warn about them (old tutorials and AI assistants
# still suggest these).
discovery:
  pub_top: 5000
  github_min_stars: 50
  discontinued_watch: [
    pedantic, js, flutter_markdown, effective_dart, uni_links, device_info, package_info, connectivity, share,
    battery, sensors, android_alarm_manager, android_intent, wifi_info_flutter, firebase_admob, e2e,
    location_permissions,
  ]

categories:
  state-management: State management
  architecture: Architecture
  navigation: Navigation
  networking: Networking
  database: Database
  serialization: Serialization
  code-generation: Code generation
  dependency-injection: Dependency injection
  ui: UI
  theming: Theming
  animation: Animation
  charts: Charts
  games: Games
  testing: Testing
  backend: Backend
  cli: CLI
  developer-tooling: Developer tooling
  open-source-app: Open source app
  firebase: Firebase
  authentication: Authentication
  maps: Maps
  ai: AI
  device: Device & sensors
  media: Media
  localization: Localization
  payments: Payments
  utilities: Utilities
  other: Other

