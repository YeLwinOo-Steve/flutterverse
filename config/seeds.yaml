# The current Hall of Fame edition. Reasons are editorial; keep them factual.
hall_of_fame:
  year: 2026
  projects:
    - { id: flutter_bloc, category: Most Influential, reason: "Set the vocabulary for structured state in Flutter; its patterns shaped how a generation of production apps are architected." }
    - { id: riverpod, category: Community Favorite, reason: "Widely recommended for compile-safe, testable state — and a frequent reference point in community architecture discussions." }
    - { id: provider, category: The Original, reason: "The first recommended approach to app state, and the foundation many later libraries built on." }
    - { id: dio, category: Most Starred, reason: "The most-starred Dart networking library, and the default HTTP layer in countless apps." }
    - { id: forui, category: Fastest Growing, reason: "From first release to a top UI kit in under two years, with steady releases." }
    - { id: wonderous, category: Best UI, reason: "A public reference for what high-craft, motion-rich Flutter UI can look like." }
    - { id: melos, category: Best Developer Tool, reason: "Made multi-package Dart repositories practical, and is now standard in large monorepos." }
    - { id: flutter_animate, category: Best Animation Project, reason: "Turned complex effect choreography into a readable, chainable API." }
    - { id: shorebird, category: Most Innovative, reason: "Brought over-the-air code push to compiled Flutter apps — previously thought impractical." }
    - { id: flame, category: Longest Running, reason: "Actively developed since 2017 — older than Flutter 1.0 itself." }
  developers:
    - { handle: felangel, name: Felix Angelov, category: Most Influential, tagline: "Creator of the bloc state management library.", projects: [flutter_bloc, mocktail] }
    - { handle: rrousselGit, name: Remi Rousselet, category: Most Prolific Author, tagline: "Author of Provider, Riverpod and Freezed.", projects: [riverpod, freezed, provider] }
    - { handle: simolus3, name: Simon Binder, category: Best Data Tooling, tagline: "Maintainer of drift, reactive SQLite for Dart.", projects: [drift] }
    - { handle: gskinner, name: Grant Skinner, category: Motion & UI Craft, tagline: "Behind flutter_animate and the Wonderous app.", projects: [flutter_animate, wonderous] }
    - { handle: imaNNeo, name: Iman Khoshabi, category: Best Visualization, tagline: "Creator of fl_chart, the go-to charting library.", projects: [fl_chart] }
    - { handle: spydon, name: Lukas Klingsbo, category: Games Pioneer, tagline: "Core maintainer of the Flame game engine.", projects: [flame] }
